<!DOCTYPE html>
<html lang="am">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0C3B2E" />
<link rel="icon" href="/favicon.svg" />
<link rel="manifest" href="/manifest.webmanifest" />
<link rel="apple-touch-icon" href="/favicon.svg" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet" />
<!-- Browser tab title — edit here -->
<title>የተስኒም ማስተር ፕሮግራም</title>
</head>
<body>
<div class="bgblob" aria-hidden="true"><i></i><i></i></div>
<header>
  <div class="top-row">
    <div class="brand">
      <!-- App logo mark — a checkmark growing out of a leaf inside a ring.
           Edit the two <path>/<circle> fill colours below to reskin it,
           or replace this whole <svg> with your own artwork. -->
      <svg class="logo" viewBox="0 0 40 40" aria-hidden="true">
        <circle cx="20" cy="20" r="18.5" fill="none" stroke="var(--gold)" stroke-width="1.6"/>
        <path d="M20 32c-6 0-10-5-9.5-11 4 1 7 .5 9.5-2 2.5 2.5 5.5 3 9.5 2C29 27 26 32 20 32Z" fill="var(--ring)"/>
        <path d="M13 20l4.5 4.5L27 14.5" fill="none" stroke="var(--btnfg)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <!-- App name shown at the top of the screen — edit here -->
      <h1 class="title">የተስኒም ማስተር ፕሮግራም</h1>
    </div>
    <div class="tools">
      <button class="ibtn glass" id="addBtn" aria-label="ፕሮግራም ጨምር">＋</button>
      <button class="ibtn glass" id="settingsBtn" aria-label="ቅንብሮች" aria-expanded="false">⚙</button>
      <button class="ibtn glass" id="themeBtn" aria-label="ገፅታ ቀይር">◐</button>
    </div>
  </div>

  <div class="settings-panel glass" id="settingsPanel">
    <button class="setrow" id="exportBtn">📤 ምትኬ አውርድ</button>
    <button class="setrow" id="importBtn">📥 ምትኬ መልስ</button>
    <input type="file" id="importFile" accept="application/json" hidden>
    <button class="setrow" id="remindBtn">🔔 ዕለታዊ ማሳወቂያ አብራ (ጥዋት 8 ሰዓት)</button>
    <!-- Recycle Bin: every deleted program/page lives here until restored
         or deleted forever. Label gets a live "(N)" count from main.js. -->
    <button class="setrow" id="trashBtn">🗑 ቆሻሻ መጣያ</button>
  </div>

  <div class="daynav">
    <button class="arrow" id="prevDay" aria-label="ትናንት">‹</button>
    <span><span class="lbl" id="dLbl"></span><span class="sub" id="dSub"></span></span>
    <button class="arrow" id="nextDay" aria-label="ነገ">›</button>
  </div>

  <div class="ringcard glass">
    <svg class="ring" viewBox="0 0 64 64" aria-hidden="true"><circle class="ring-track" cx="32" cy="32" r="26"/><circle class="ring-fill" id="ringFill" cx="32" cy="32" r="26"/></svg>
    <div class="ring-text" id="ringText"></div>
  </div>

  <div class="pillrow">
    <button class="pill" id="dayRepBtn" aria-expanded="false">የቀን ሪፖርት</button>
    <button class="pill" id="weekBtn" aria-expanded="false">ሳምንታዊ ሪፖርት</button>
  </div>
  <div class="week-panel glass" id="dayReportPanel"></div>
  <div class="week-panel glass" id="weekPanel"></div>

  <!-- Read-only reference pages (prohibited foods, notices, and any you add).
       Fully generated by main.js from data.js's INFO_PAGES + anything you've
       edited/added in-app — nothing static needs editing here. -->
  <div class="pagesrow" id="pagesRow"></div>
  <div id="pagesPanels"></div>
</header>

<main id="list"></main>

<div class="toast glass" id="toast" role="status"></div>
<div class="overlay" id="overlay"></div>

<!-- Quick edit: name + description only, asks "today only" vs "every time".
     For category / type / sub-items / days, open the program's own
     detail view (tap its name) → አርትዕ tab. -->
<div class="sheet" id="sheet" role="dialog" aria-modal="true">
  <h2>ፈጣን ማስተካከል</h2>
  <label for="eName">ስም</label><input type="text" id="eName" maxlength="60">
  <label for="eDesc">ዝርዝር</label><textarea id="eDesc" maxlength="2000"></textarea>
  <div class="rowbtns"><button class="cancelbtn" id="eCancel">ሰርዝ</button><button class="savebtn" id="eSave">አስቀምጥ</button></div>
</div>

<!-- Add-program sheet. Field order is deliberate: category → type
     (+ sub-items if "master") → name → description → days. -->
<div class="sheet" id="addSheet" role="dialog" aria-modal="true">
  <h2>አዲስ ፕሮግራም</h2>

  <label for="aCat">ምድብ</label>
  <input type="text" id="aCat" list="catList" maxlength="30" placeholder="ለምሳሌ፡ ምግብ (አዲስ ምድብ ለመፍጠር ብቻ ይተይቡ)">
  <datalist id="catList"></datalist>

  <label>ዓይነት</label>
  <div class="typerow">
    <button type="button" class="typebtn active" data-type="simple">ነጠላ ✓ (ቀላል)</button>
    <button type="button" class="typebtn" data-type="checklist">ማስተር (ንዑስ ዝርዝር)</button>
  </div>
  <div id="subWrap" hidden>
    <label>ንዑስ ዝርዝሮች — ሁሉም ሲጠናቀቁ ማስተር ራሱ ✓ ይሆናል</label>
    <div id="subList"></div>
    <button type="button" class="addsub" id="addSub">+ ንዑስ ጨምር</button>
  </div>

  <label for="aName">ስም</label><input type="text" id="aName" maxlength="60">
  <label for="aDesc">ዝርዝር</label><textarea id="aDesc" maxlength="2000"></textarea>

  <label>መቼ ይታይ</label>
  <div class="daychips" id="dayChips"></div>

  <div class="rowbtns"><button class="cancelbtn" id="aCancel">ሰርዝ</button><button class="savebtn" id="aSave">አክል</button></div>
</div>

<!-- Read-only page view/edit sheet, shared by every page in #pagesRow -->
<div class="sheet" id="pageSheet" role="dialog" aria-modal="true">
  <h2 id="pageSheetTitle">ገፅ አርትዕ</h2>
  <label for="pTitle">ርዕስ</label><input type="text" id="pTitle" maxlength="60">
  <label for="pBody">ይዘት (እያንዳንዱ አዲስ መስመር የራሱ ነጥብ ይሆናል)</label><textarea id="pBody" maxlength="4000"></textarea>
  <div class="rowbtns"><button class="cancelbtn" id="pCancel">ሰርዝ</button><button class="savebtn" id="pSave">አስቀምጥ</button></div>
</div>

<!-- Per-program detail view: Calendar / Statistics / Edit -->
<div class="detail" id="detailView" role="dialog" aria-modal="true" aria-label="የፕሮግራም ዝርዝር">
  <div class="detail-head">
    <button class="arrow" id="detailBack" aria-label="ተመለስ">‹</button>
    <div class="detail-title" id="detailTitle"></div>
    <span class="tag" id="detailCat"></span>
  </div>
  <div class="detail-tabs" id="detailTabs">
    <button class="dtab active" data-tab="cal">ቀን መቁጠሪያ</button>
    <button class="dtab" data-tab="stat">ስታትስቲክስ</button>
    <button class="dtab" data-tab="edit">አርትዕ</button>
  </div>
  <div class="detail-body" id="detailBody"></div>
</div>

<!-- Recycle Bin: every deleted program/page (Restore or delete forever).
     Same full-screen layout as the program detail view above. -->
<div class="detail" id="trashView" role="dialog" aria-modal="true" aria-label="ቆሻሻ መጣያ">
  <div class="detail-head">
    <button class="arrow" id="trashBack" aria-label="ተመለስ">‹</button>
    <div class="detail-title">ቆሻሻ መጣያ</div>
    <button type="button" class="setrow trash-clear-all" id="trashClearAll" hidden>ባዶ አድርግ</button>
  </div>
  <div class="detail-body" id="trashBody"></div>
</div>

<script type="module" src="/src/main.js"></script>
</body>
</html>
